services:
  auth.database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-WalletDev_2026!StrongPassword}
    ports:
      - "1433:1433"
    volumes:
      - auth-database-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  auth.api:
    image: ${DOCKER_REGISTRY-}authapi
    build:
      context: .
      dockerfile: Auth/Auth.Api/Dockerfile
    depends_on:
      auth.database:
        condition: service_healthy
    expose:
      - "8080"
      - "8081"

  transaction.api:
    image: ${DOCKER_REGISTRY-}transactionapi
    build:
      context: .
      dockerfile: Transaction/Transaction.Api/Dockerfile
    expose:
      - "8080"
      - "8081"

  wallet.api:
    image: ${DOCKER_REGISTRY-}walletapi
    build:
      context: .
      dockerfile: Wallet/Wallet.Api/Dockerfile
    expose:
      - "8080"
      - "8081"

volumes:
  auth-database-data:

